version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Atualizacoes de patch juntas: abrir cinco PRs por semana para bump de patch
      # e a forma mais rapida de o Dependabot ser ignorado.
      patches:
        update-types: ["patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
